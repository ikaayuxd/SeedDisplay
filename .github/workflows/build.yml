name: Build SeedDisplay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK r26b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Fetch ImGui sources
        run: |
          mkdir -p jni/imgui
          TAG=v1.90
          BASE=https://raw.githubusercontent.com/ocornut/imgui/${TAG}
          curl -sL ${BASE}/imgui.h                          -o jni/imgui/imgui.h
          curl -sL ${BASE}/imgui_internal.h                 -o jni/imgui/imgui_internal.h
          curl -sL ${BASE}/imconfig.h                       -o jni/imgui/imconfig.h
          curl -sL ${BASE}/imstb_textedit.h                 -o jni/imgui/imstb_textedit.h
          curl -sL ${BASE}/imstb_truetype.h                 -o jni/imgui/imstb_truetype.h
          curl -sL ${BASE}/imstb_rectpack.h                 -o jni/imgui/imstb_rectpack.h
          curl -sL ${BASE}/imgui.cpp                        -o jni/imgui/imgui.cpp
          curl -sL ${BASE}/imgui_draw.cpp                   -o jni/imgui/imgui_draw.cpp
          curl -sL ${BASE}/imgui_tables.cpp                 -o jni/imgui/imgui_tables.cpp
          curl -sL ${BASE}/imgui_widgets.cpp                -o jni/imgui/imgui_widgets.cpp
          curl -sL ${BASE}/backends/imgui_impl_opengl3.h    -o jni/imgui/imgui_impl_opengl3.h
          curl -sL ${BASE}/backends/imgui_impl_opengl3.cpp  -o jni/imgui/imgui_impl_opengl3.cpp
          curl -sL ${BASE}/backends/imgui_impl_android.h    -o jni/imgui/imgui_impl_android.h
          curl -sL ${BASE}/backends/imgui_impl_android.cpp  -o jni/imgui/imgui_impl_android.cpp

      - name: Build
        run: |
          ndk-build NDK_PROJECT_PATH=. \
                    APP_BUILD_SCRIPT=jni/Android.mk \
                    NDK_APPLICATION_MK=jni/Application.mk \
                    -j$(nproc)

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: SeedDisplay
          path: libs/arm64-v8a/libSeedDisplay.so

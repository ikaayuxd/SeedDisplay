name: Build SeedDisplay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK r26b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      # ── Copy libBedrockTools.so into the jni/libs tree ──────────────────────
      # You must commit libBedrockTools.so into your repo under:
      #   jni/libs/arm64-v8a/libBedrockTools.so
      #   jni/libs/armeabi-v7a/libBedrockTools.so  (if targeting 32-bit too)
      #
      # The .so from the upload is arm64-v8a (ELF 64-bit aarch64).

      # ── Download ImGui headers (needed at compile time) ──────────────────────
      - name: Fetch ImGui headers
        run: |
          mkdir -p jni/imgui
          TAG=v1.90
          BASE=https://raw.githubusercontent.com/ocornut/imgui/${TAG}
          curl -sL ${BASE}/imgui.h                          -o jni/imgui/imgui.h
          curl -sL ${BASE}/imgui_internal.h                 -o jni/imgui/imgui_internal.h
          curl -sL ${BASE}/imconfig.h                       -o jni/imgui/imconfig.h
          curl -sL ${BASE}/backends/imgui_impl_opengl3.h    -o jni/imgui/imgui_impl_opengl3.h
          curl -sL ${BASE}/backends/imgui_impl_android.h    -o jni/imgui/imgui_impl_android.h
          # We do NOT compile imgui .cpp files — they are already inside libBedrockTools.so

      # ── Build ────────────────────────────────────────────────────────────────
      - name: ndk-build
        run: |
          ndk-build NDK_PROJECT_PATH=. \
                    APP_BUILD_SCRIPT=jni/Android.mk \
                    NDK_APPLICATION_MK=jni/Application.mk \
                    -j$(nproc)

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: SeedDisplay
          path: |
            libs/arm64-v8a/libSeedDisplay.so
            libs/armeabi-v7a/libSeedDisplay.so
